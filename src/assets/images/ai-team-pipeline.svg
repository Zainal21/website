<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title" xmlns:xlink="http://www.w3.org/1999/xlink">
  <title id="title">Pipeline flow: Plan → Execute → Test → Review → Hunt → Report → Fix → Loop</title>
  <defs>
    <style>
      .bg { fill: none; }
      .card { fill: #171717; stroke: #3a3a3a; stroke-width: 2; rx: 14; ry: 14; }
      .card-light { fill: #ffffff; stroke: #e5e5e5; stroke-width: 2; rx: 14; ry: 14; }
      .loop-card { fill: #262626; stroke: #6366f1; stroke-width: 2; rx: 14; ry: 14; }
      .title { fill: #ffffff; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17; text-anchor: middle; dominant-baseline: middle; }
      .title-light { fill: #171717; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 17; text-anchor: middle; dominant-baseline: middle; }
      .sub { fill: #a3a3a3; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12; text-anchor: middle; dominant-baseline: middle; }
      .sub-light { fill: #525252; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 12; text-anchor: middle; dominant-baseline: middle; }
      .stage { fill: #6366f1; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13; text-anchor: middle; dominant-baseline: middle; }
      .stage-dark { fill: #171717; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #a3a3a3; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .loop-line { stroke: #6366f1; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: #a3a3a3; }
      .loop-arrow { fill: #6366f1; }
      .badge { fill: #262626; stroke: #6366f1; stroke-width: 2; rx: 8; ry: 8; }
      .badge-light { fill: #f5f5f5; stroke: #e5e5e5; stroke-width: 2; rx: 8; ry: 8; }
      .badge-text { fill: #6366f1; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11; text-anchor: middle; dominant-baseline: middle; }
      .badge-text-light { fill: #171717; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a3a3a3" />
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#404040" />
    </marker>
  </defs>

  <!-- Background panel -->
  <rect class="bg" x="0" y="0" width="1000" height="520" />

  <!-- Main flow row: y = 260 -->
  <!-- 1. Plan -->
  <g id="plan">
    <rect x="30" y="190" width="180" height="100" class="card" />
    <text x="120" y="225" class="stage">1. Plan</text>
    <text x="120" y="248" class="title">planner</text>
    <text x="120" y="272" class="sub">Read-only</text>
    <text x="120" y="292" class="sub">Plan + acceptance criteria</text>
  </g>

  <!-- 2. Execute -->
  <g id="execute">
    <rect x="250" y="190" width="180" height="100" class="card" />
    <text x="340" y="225" class="stage">2. Execute</text>
    <text x="340" y="248" class="title">coder</text>
    <text x="340" y="272" class="sub">Read, edit, bash</text>
    <text x="340" y="292" class="sub">Code + new tests</text>
  </g>

  <!-- 3. Test -->
  <g id="test">
    <rect x="470" y="190" width="180" height="100" class="card-light" />
    <text x="560" y="225" class="stage-dark">3. Test</text>
    <text x="560" y="248" class="title-light">orchestrator</text>
    <text x="560" y="272" class="sub-light">Runs real test</text>
    <text x="560" y="292" class="sub-light">Pass / fail + log</text>
  </g>

  <!-- 4. Review -->
  <g id="review">
    <rect x="690" y="190" width="180" height="100" class="card" />
    <text x="780" y="225" class="stage">4. Review</text>
    <text x="780" y="248" class="title">reviewer</text>
    <text x="780" y="272" class="sub">Read-only</text>
    <text x="780" y="292" class="sub">approved + issues</text>
  </g>

  <!-- Loop arrow from Review back to Execute -->
  <path d="M 810 310 Q 810 410 340 410 Q 300 410 300 310" class="loop-line" marker-end="url(#arrow-loop)" />
  <text x="500" y="418" class="badge-text">Loop (max 3 rounds)</text>

  <!-- 5. Hunt bugs -->
  <g id="hunt">
    <rect x="910" y="190" width="180" height="100" class="card" />
    <text x="1000" y="225" class="stage">5. Hunt bugs</text>
    <text x="1000" y="248" class="title">bug-hunter</text>
    <text x="1000" y="272" class="sub">Tests only</text>
    <text x="1000" y="292" class="sub">List of bugs</text>
  </g>

  <!-- 6. Report -->
  <g id="report">
    <rect x="250" y="380" width="180" height="100" class="card-light" />
    <text x="340" y="415" class="stage-dark">6. Report</text>
    <text x="340" y="438" class="title-light">bug-reporter</text>
    <text x="340" y="462" class="sub-light">Tests only</text>
    <text x="340" y="482" class="sub-light">Bug report + failing test</text>
  </g>

  <!-- 7. Fix -->
  <g id="fix">
    <rect x="470" y="380" width="180" height="100" class="loop-card" />
    <text x="560" y="415" class="stage">7. Fix</text>
    <text x="560" y="438" class="title">fixer</text>
    <text x="560" y="462" class="sub">No test edits</text>
    <text x="560" y="482" class="sub">Minimal fix</text>
  </g>

  <!-- Commit -->
  <g id="commit">
    <rect x="690" y="380" width="180" height="100" class="card-light" />
    <text x="780" y="415" class="stage-dark">Done</text>
    <text x="780" y="438" class="title-light">commit</text>
    <text x="780" y="462" class="sub-light">Local only</text>
    <text x="780" y="482" class="sub-light">Never push</text>
  </g>

  <!-- Forward arrows -->
  <line x1="210" y1="240" x2="250" y2="240" class="line" marker-end="url(#arrow)" />
  <line x1="430" y1="240" x2="470" y2="240" class="line" marker-end="url(#arrow)" />
  <line x1="650" y1="240" x2="690" y2="240" class="line" marker-end="url(#arrow)" />
  <line x1="870" y1="240" x2="910" y2="240" class="line" marker-end="url(#arrow)" />

  <!-- Hunt → Report (down then left) -->
  <line x1="1000" y1="290" x2="1000" y2="340" class="line" marker-end="url(#arrow)" />
  <line x1="1000" y1="340" x2="430" y2="340" class="line" marker-end="url(#arrow)" />
  <line x1="430" y1="340" x2="430" y2="380" class="line" marker-end="url(#arrow)" />

  <!-- Report → Fix -->
  <line x1="430" y1="430" x2="470" y2="430" class="line" marker-end="url(#arrow)" />

  <!-- Fix → Commit -->
  <line x1="650" y1="430" x2="690" y2="430" class="line" marker-end="url(#arrow)" />

  <!-- Commit → back to plan? No, commit ends. Hunt → back to test via execute? -->
  <!-- Decision diamonds: pass/fail after Test, approved? after Review, findings? after Hunt -->
  <!-- Test pass/fail split -->
  <g id="diamond-test">
    <polygon points="650,190 700,215 650,240 600,215" fill="none" stroke="#a3a3a3" stroke-width="2" />
    <text x="650" y="215" class="sub" font-size="10">fail</text>
  </g>
  <line x1="560" y1="290" x2="600" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="615" y="255" class="sub" font-size="11">fix loop</text>

  <!-- Review approved split -->
  <g id="diamond-review">
    <polygon points="870,190 920,215 870,240 820,215" fill="none" stroke="#a3a3a3" stroke-width="2" />
    <text x="870" y="215" class="sub" font-size="10">no</text>
  </g>
  <line x1="780" y1="290" x2="820" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="835" y="255" class="sub" font-size="11">fix loop</text>

  <!-- Hunt findings split -->
  <g id="diamond-hunt">
    <polygon points="1090,190 1140,215 1090,240 1040,215" fill="none" stroke="#a3a3a3" stroke-width="2" />
    <text x="1090" y="215" class="sub" font-size="10">no</text>
  </g>
  <line x1="1000" y1="290" x2="1040" y2="215" class="line" marker-end="url(#arrow)" />
  <text x="1055" y="255" class="sub" font-size="11">done</text>

  <!-- Legend -->
  <rect x="30" y="440" width="200" height="60" fill="none" stroke="#3a3a3a" stroke-width="1" rx="8" ry="8" />
  <text x="50" y="460" class="stage-dark">Legend</text>
  <rect x="45" y="472" width="16" height="16" fill="#171717" stroke="#3a3a3a" stroke-width="1" rx="4" ry="4" />
  <text x="70" y="481" class="sub-dark" font-size="12">Source code role</text>
  <rect x="45" y="490" width="16" height="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="1" rx="4" ry="4" />
  <text x="70" y="499" class="sub-dark" font-size="12">Orchestrator role</text>

  <!-- Dark mode override via class on body is not possible inside SVG; use CSS variables-safe grays. -->
</svg>